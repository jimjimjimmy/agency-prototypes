# XcodeGen spec. Run `xcodegen generate` in this folder to create BattleOfTheBands.xcodeproj.
# Bundle ID and signing team are placeholders. Jimmy supplies the real values before any device or TestFlight build.
name: BattleOfTheBands
options:
  bundleIdPrefix: com.placeholder
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Automatic
targets:
  BattleOfTheBands:
    type: application
    platform: iOS
    sources:
      - path: BattleOfTheBands
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.placeholder.battleofthebands
        GENERATE_INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Battle of the Bands
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  BattleOfTheBands:
    build:
      targets:
        BattleOfTheBands: all
